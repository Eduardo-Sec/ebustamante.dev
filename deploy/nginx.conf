# Don't advertise the exact nginx version in headers/error pages —
# free reconnaissance for anyone checking for a version-specific CVE.
server_tokens off;

# No file uploads on this site; cap body size well below anything
# a real request would need.
client_max_body_size 2M;

# Second, independent rate limiter in front of Django's own — covers
# every path (admin login, static files, etc.), not just the two
# search endpoints Django throttles itself.
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80 default_server;
    server_name ebustamante.dev localhost 127.0.0.1;

    # Serve static files directly — bypass gunicorn entirely
    location /static/ {
        alias /opt/ebustamante/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Resume: stable URL outside the hashed static pipeline, since its
    # filename must never change even though its content will (re-published
    # several times a year). Not going through ManifestStaticFilesStorage
    # means updating it is just replacing this one file -- no collectstatic,
    # no gunicorn restart, and no accumulation of orphaned hashed copies.
    # Short-lived, revalidatable cache instead of the immutable/30d policy
    # above, since this file's bytes change without its URL changing.
    location = /resume/ {
        # alias must target the directory (not the file directly) and let
        # try_files name the file explicitly -- aliasing straight to a file
        # under a location that ends in "/" makes nginx's index module
        # blindly concatenate "index.html" onto the alias target instead of
        # serving it, since it assumes any trailing-slash location resolves
        # to a directory.
        alias /opt/ebustamante/files/;
        try_files resume.pdf =404;
        add_header Content-Disposition 'inline; filename="Eduardo_Bustamante_Resume.pdf"';
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # Bare path (no trailing slash) -- Django's APPEND_SLASH can't help
    # here since nothing under this exact path is routed to Django anymore.
    location = /resume {
        return 301 /resume/;
    }

    # Legacy URLs that used to serve the resume, from the Hugo site and
    # from the pre-files/ ManifestStaticFilesStorage setup. Redirect rather
    # than 404 since these may already be sitting in old job applications.
    location = /resume.pdf {
        return 301 https://ebustamante.dev/resume/;
    }
    location = /static/resume.pdf {
        return 301 https://ebustamante.dev/resume/;
    }
    location = /static/resume.2bde7a55d5ca.pdf {
        return 301 https://ebustamante.dev/resume/;
    }

    # Proxy everything else to gunicorn
    location / {
        limit_req          zone=general burst=20 nodelay;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Hardcoded, not $scheme: nginx only ever receives plain HTTP from
        # the Cloudflare Tunnel locally, but the original client connection
        # to Cloudflare's edge is always HTTPS (tunnel has no other path
        # in). Using $scheme here reports "http" and causes an infinite
        # redirect loop with Django's SECURE_SSL_REDIRECT.
        proxy_set_header   X-Forwarded-Proto https;
        proxy_redirect     off;
        proxy_read_timeout 30s;
    }
}
