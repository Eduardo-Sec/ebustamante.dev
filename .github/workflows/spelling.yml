name: Check spelling

on:
  push:
    branches:
      - master
    paths:
      - 'content/**/*.md'
  pull_request:
    branches:
      - master
    paths:
      - 'content/**/*.md'

permissions:
  contents: read

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check spelling
        uses: streetsidesoftware/cspell-action@e0668cf020899e887ee8ad4d173c31738a79eae8 # v9.0.1
        with:
          files: content/**/*.md
          config: cspell.json
          incremental_files_only: false
          inline: warning
          strict: true